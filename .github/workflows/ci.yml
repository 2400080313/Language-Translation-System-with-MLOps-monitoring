name: CI Pipeline - Language Translation System with MLOps Monitoring

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-ci:
    name: Frontend Verification (TypeScript & Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript & Vite Production Build
        run: npm run build

      - name: Run Vitest Unit Test Suite
        run: npm test

  backend-ci:
    name: Backend Verification (FastAPI, Pytest, Alembic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        run: pytest -v

      - name: Validate Alembic Migrations
        run: alembic upgrade head
