services:
  db:
    image: postgres:16-alpine
    container_name: translateml-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-translateml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-translateml_secure_pw2026}
      POSTGRES_DB: ${POSTGRES_DB:-translateml_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translateml -d translateml_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: translateml-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-translateml}:${POSTGRES_PASSWORD:-translateml_secure_pw2026}@db:5432/${POSTGRES_DB:-translateml_db}
      - SECRET_KEY=${SECRET_KEY:-academic-mlops-translation-system-secret-key-2026-secure}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@translateml.edu}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-AdminSecret2026!}
      - INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME:-Prof. Translation Admin}
      - ACTIVE_MODEL_NAME=M2M100-Indic-v2.1
      - ACTIVE_MODEL_VERSION=v2.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: translateml-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: translateml-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: translateml-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
